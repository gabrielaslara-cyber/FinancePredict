name: Banking API - Java CI
on:
  push:
    paths:
      - 'banking-api/**'
      - '.github/workflows/banking-api.yml'
  pull_request:
    paths:
      - 'banking-api/**'
      - '.github/workflows/banking-api.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banking-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: banking-api/pom.xml
      - name: Testar e empacotar
        run: mvn -B verify
